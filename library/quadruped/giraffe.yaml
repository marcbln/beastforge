meta:
  name: giraffe
  description: "A tall savanna grazer with a long neck, ossicones, and long slender legs."
  category: quadruped
  tags: [quadruped, giraffe, grazer, savanna, tall]
  author: beastforge
  tested_with: "0.1.0"
  version: "1.0.0"

params:
  - {name: neck-length, type: float, default: 1.8, min: 1.0, max: 3.0, unit: m,
     description: "Combined length of the neck bones."}
  - {name: seed, type: int, default: 20624, min: 0, max: 1000000,
     description: "Deterministic noise seed."}

budgets: {vertices: 20000, bones: 64, triangles: 60000, max_clip_ticks: 600}

skeleton:
  root: root
  bones:
    - {name: root, parent: null,
       rest: {translation: [0, 2.5, 0], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: spine-01, parent: root,
       rest: {translation: [0, 0.05, 0.4], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: spine-02, parent: spine-01,
       rest: {translation: [0, 0.05, 0.4], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: spine-03, parent: spine-02,
       rest: {translation: [0, 0, 0.4], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: neck-01, parent: spine-01,
       rest: {translation: [0, 0.35, -0.35], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: neck-02, parent: neck-01,
       rest: {translation: [0, 0.55, -0.25], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: neck-03, parent: neck-02,
       rest: {translation: [0, 0.55, -0.25], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: head, parent: neck-03,
       rest: {translation: [0, 0.35, -0.35], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: muzzle, parent: head,
       rest: {translation: [0, -0.05, -0.22], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: ossicone-l, parent: head,
       rest: {translation: [0.07, 0.16, 0.02], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: ossicone-r, parent: head,
       rest: {translation: [-0.07, 0.16, 0.02], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: tail-01, parent: spine-03,
       rest: {translation: [0, 0.05, 0.25], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: tail-02, parent: tail-01,
       rest: {translation: [0, -0.05, 0.3], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: tail-tuft, parent: tail-02,
       rest: {translation: [0, -0.1, 0.12], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: shoulder-fl, parent: spine-01,
       rest: {translation: [0.26, -0.1, -0.12], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: upper-fl, parent: shoulder-fl,
       rest: {translation: [0, -0.9, 0], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: lower-fl, parent: upper-fl,
       rest: {translation: [0, -0.85, 0], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: foot-fl, parent: lower-fl,
       rest: {translation: [0, -0.32, -0.08], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: shoulder-fr, parent: spine-01,
       rest: {translation: [-0.26, -0.1, -0.12], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: upper-fr, parent: shoulder-fr,
       rest: {translation: [0, -0.9, 0], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: lower-fr, parent: upper-fr,
       rest: {translation: [0, -0.85, 0], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: foot-fr, parent: lower-fr,
       rest: {translation: [0, -0.32, -0.08], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: hip-rl, parent: spine-03,
       rest: {translation: [0.26, -0.1, 0.0], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: upper-rl, parent: hip-rl,
       rest: {translation: [0, -0.92, 0], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: lower-rl, parent: upper-rl,
       rest: {translation: [0, -0.88, 0], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: foot-rl, parent: lower-rl,
       rest: {translation: [0, -0.32, -0.08], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: hip-rr, parent: spine-03,
       rest: {translation: [-0.26, -0.1, 0.0], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: upper-rr, parent: hip-rr,
       rest: {translation: [0, -0.92, 0], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: lower-rr, parent: upper-rr,
       rest: {translation: [0, -0.88, 0], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
    - {name: foot-rr, parent: lower-rr,
       rest: {translation: [0, -0.32, -0.08], rotation: [0, 0, 0, 1], scale: [1, 1, 1]}}
  chains:
    - {name: head-chain, bones: [neck-01, neck-02, neck-03, head]}
    - {name: front-left-leg, bones: [upper-fl, lower-fl, foot-fl]}
    - {name: front-right-leg, bones: [upper-fr, lower-fr, foot-fr]}
    - {name: rear-left-leg, bones: [upper-rl, lower-rl, foot-rl]}
    - {name: rear-right-leg, bones: [upper-rr, lower-rr, foot-rr]}
    - {name: tail, bones: [tail-01, tail-02, tail-tuft]}

surfaces:
  - name: body
    mode: sweep
    kind: torso-shell
    bones: [spine-01, spine-02, spine-03]
    rings: 14
    segments: 16
    radius: {start: 0.42, end: 0.32}
    modifiers:
      taper: {start: 1.0, end: 0.9}
      squash: [0.78, 1.15, 1.0]
      radial_noise: {amplitude: 0.02, frequency: 4.0, seed: 11}
    material: hide
  - name: neck
    mode: sweep
    kind: torso-shell
    bones: [neck-01, neck-02, neck-03, head]
    rings: 16
    segments: 12
    radius: {start: 0.2, end: 0.1}
    modifiers:
      squash: [0.85, 1.0, 1.0]
      radial_noise: {amplitude: 0.015, frequency: 5.0, seed: 12}
    material: hide
  - name: front-left-leg
    mode: sweep
    kind: limb-tube
    bones: [upper-fl, lower-fl, foot-fl]
    rings: 12
    segments: 8
    radius: {start: 0.11, end: 0.05}
    material: hide
  - name: front-right-leg
    mode: sweep
    kind: limb-tube
    bones: [upper-fr, lower-fr, foot-fr]
    rings: 12
    segments: 8
    radius: {start: 0.11, end: 0.05}
    material: hide
  - name: rear-left-leg
    mode: sweep
    kind: limb-tube
    bones: [upper-rl, lower-rl, foot-rl]
    rings: 12
    segments: 8
    radius: {start: 0.12, end: 0.05}
    material: hide
  - name: rear-right-leg
    mode: sweep
    kind: limb-tube
    bones: [upper-rr, lower-rr, foot-rr]
    rings: 12
    segments: 8
    radius: {start: 0.12, end: 0.05}
    material: hide
  - name: tail
    mode: sweep
    kind: limb-tube
    bones: [tail-01, tail-02]
    rings: 8
    segments: 6
    radius: {start: 0.09, end: 0.03}
    material: hide
  - name: head
    mode: sweep
    kind: rigid-part
    bones: [head]
    rigid_bone: head
    rings: 5
    segments: 10
    radius: {start: 0.17, end: 0.17}
    modifiers:
      squash: [0.9, 0.95, 1.2]
    material: hide
  - name: muzzle
    mode: sweep
    kind: rigid-part
    bones: [muzzle]
    rigid_bone: muzzle
    rings: 4
    segments: 8
    radius: {start: 0.08, end: 0.08}
    modifiers:
      squash: [0.85, 0.8, 1.3]
    material: hide
  - name: ossicone-left
    mode: sweep
    kind: rigid-part
    bones: [ossicone-l]
    rigid_bone: ossicone-l
    rings: 4
    segments: 6
    radius: {start: 0.05, end: 0.05}
    material: hair
  - name: ossicone-right
    mode: sweep
    kind: rigid-part
    bones: [ossicone-r]
    rigid_bone: ossicone-r
    rings: 4
    segments: 6
    radius: {start: 0.05, end: 0.05}
    material: hair
  - name: tail-tuft
    mode: sweep
    kind: rigid-part
    bones: [tail-tuft]
    rigid_bone: tail-tuft
    rings: 4
    segments: 6
    radius: {start: 0.07, end: 0.07}
    material: hair
  - name: hoof-front-left
    mode: sweep
    kind: rigid-part
    bones: [foot-fl]
    rigid_bone: foot-fl
    rings: 4
    segments: 6
    radius: {start: 0.07, end: 0.07}
    modifiers:
      squash: [1.0, 0.9, 1.3]
    material: hoof
  - name: hoof-front-right
    mode: sweep
    kind: rigid-part
    bones: [foot-fr]
    rigid_bone: foot-fr
    rings: 4
    segments: 6
    radius: {start: 0.07, end: 0.07}
    modifiers:
      squash: [1.0, 0.9, 1.3]
    material: hoof
  - name: hoof-rear-left
    mode: sweep
    kind: rigid-part
    bones: [foot-rl]
    rigid_bone: foot-rl
    rings: 4
    segments: 6
    radius: {start: 0.07, end: 0.07}
    modifiers:
      squash: [1.0, 0.9, 1.3]
    material: hoof
  - name: hoof-rear-right
    mode: sweep
    kind: rigid-part
    bones: [foot-rr]
    rigid_bone: foot-rr
    rings: 4
    segments: 6
    radius: {start: 0.07, end: 0.07}
    modifiers:
      squash: [1.0, 0.9, 1.3]
    material: hoof

materials:
  - {name: hide, texture: giraffe, params: {patch-density: 5, seed: 20624}, size: 512x512,
     metallic: 0.0, roughness: 0.85}
  - {name: hair, texture: hair, params: {strands: 64, seed: 77}, size: 256x256,
     metallic: 0.0, roughness: 0.9}
  - {name: hoof, texture: marble-veined,
     params: {vein-scale: 6, seed: 44, body-color: "#3a332c",
              vein-color: "#221e1a"}, size: 256x256,
     metallic: 0.0, roughness: 0.55}

clips:
  - {name: idle, generator: breathe, duration: 2.0, loop: true,
     params: {amplitude: 0.03, cycles: 1}}
  - {name: locomotion, generator: gait, duration: 1.4, loop: true,
     params: {stride: 0.28, duty: 0.6, bob: 0.03,
              legs: [front-left-leg, front-right-leg, rear-left-leg, rear-right-leg]}}
  - name: attack
    generator: telegraph-attack
    ticks: 60
    loop: false
    params: {windup: 0.45, strike: 0.15, recovery: 0.4, reach: 1.4}
    events:
      - {name: impact, ticks: 40}
  - {name: hurt, generator: recoil, duration: 0.5, loop: false,
     params: {amplitude: 0.16, decay: 8.0}}
  - {name: death, generator: death-collapse, duration: 1.5, loop: false,
     params: {collapse: 0.9}}

sockets:
  - {name: muzzle, bone: muzzle, offset: [0, 0, -0.08]}

volumes:
  - {name: body-hull, role: hit, center: [0, 2.55, 0.55], extents: [0.42, 0.5, 1.0]}
  - {name: head-weak, role: weak-point, center: [0, 4.35, -0.8],
     extents: [0.18, 0.18, 0.22], bone: head}
