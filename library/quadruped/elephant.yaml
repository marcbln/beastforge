meta:
  name: elephant
  description: "A massive savanna elephant with a long curling trunk, ivory tusks, and broad ears."
  category: quadruped
  tags: [quadruped, elephant, tusks, trunk, savanna, heavy]
  author: beastforge
  tested_with: "0.1.0"
  version: "1.0.0"

params:
  - {name: body-mass, type: float, default: 1.0, min: 0.6, max: 1.6, unit: ratio,
     description: "Relative body mass used for bulk tuning."}
  - {name: seed, type: int, default: 8042, min: 0, max: 1000000,
     description: "Deterministic noise seed."}

budgets: {vertices: 20000, bones: 64, triangles: 60000, max_clip_ticks: 600}

skeleton:
