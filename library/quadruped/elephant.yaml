surfaces:
  - name: body
    mode: sweep
    kind: torso-shell
    bones: [spine-01, spine-02, spine-03]
    rings: 16
    segments: 20
    radius: {start: 0.58, end: 0.44}
    modifiers:
      taper: {start: 1.0, end: 0.9}
      squash: [1.0, 1.0, 1.05]
      radial_noise: {amplitude: 0.015, frequency: 4.0, seed: 21}
    material: hide
  - name: trunk
    mode: sweep
    kind: limb-tube
    bones: [trunk-01, trunk-02, trunk-03, trunk-04, trunk-tip]
    rings: 20
    segments: 10
    radius: {start: 0.15, end: 0.035}
    modifiers:
      radial_noise: {amplitude: 0.02, frequency: 9.0, seed: 22}
    material: hide
  - name: front-left-leg
    mode: sweep
    kind: limb-tube
    bones: [upper-fl, lower-fl, foot-fl]
    rings: 12
    segments: 10
