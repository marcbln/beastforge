materials:
  - {name: hide, texture: cracked-earth,
     params: {cells: 8, seed: 91, crack-color: "#2f2e2b",
              mud-light: "#6a6862", mud-dark: "#4a4844"}, size: 512x512,
     metallic: 0.0, roughness: 0.9}
  - {name: tusk, texture: marble-veined,
     params: {vein-scale: 3, seed: 15, body-color: "#e6dcc2",
              vein-color: "#cdbb90"}, size: 256x256,
     metallic: 0.0, roughness: 0.35}
  - {name: nail, texture: marble-veined,
     params: {vein-scale: 6, seed: 52, body-color: "#3a3835",
              vein-color: "#252422"}, size: 256x256,
     metallic: 0.0, roughness: 0.55}
  - {name: hair, texture: hair, params: {strands: 48, seed: 61}, size: 256x256,
     metallic: 0.0, roughness: 0.9}

clips:
  - {name: idle, generator: breathe, duration: 2.2, loop: true,
     params: {amplitude: 0.03, cycles: 1}}
  - {name: locomotion, generator: gait, duration: 1.6, loop: true,
     params: {stride: 0.18, duty: 0.65, bob: 0.02,
              legs: [front-left-leg, front-right-leg, rear-left-leg, rear-right-leg]}}
  - name: attack
    generator: telegraph-attack
    ticks: 70
    loop: false
    params: {windup: 0.5, strike: 0.2, recovery: 0.45, reach: 1.2}
    events:
      - {name: impact, ticks: 42}
  - {name: hurt, generator: recoil, duration: 0.6, loop: false,
     params: {amplitude: 0.14, decay: 7.0}}
  - {name: death, generator: death-collapse, duration: 1.8, loop: false,
     params: {collapse: 0.9}}

sockets:
  - {name: trunk-tip, bone: trunk-tip, offset: [0, -0.05, 0]}

volumes:
  - {name: body-hull, role: hit, center: [0, 1.62, 0.7], extents: [0.6, 0.55, 1.05]}
  - {name: head-weak, role: weak-point, center: [0, 1.85, -0.55],
     extents: [0.3, 0.3, 0.35], bone: head}
