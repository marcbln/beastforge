name: vehicle-hull-panel
family: vehicle
version: "1.0.0"
description: "Closed rigid hull panel."
surface:
  mode: sweep
  kind: rigid-part
  bones: ["@mount"]
  rigid_bone: "@mount"
  rings: 4
  segments: 6
  radius: {start: 0.45, end: 0.45}
  material: chitin
params:
  - {name: rings, type: int, min: 2, max: 12, unit: count,
     description: "Rings along the panel."}
  - {name: segments, type: int, min: 3, max: 16, unit: count,
     description: "Radial segments per ring."}
  - {name: scale-x, type: float, min: 0.1, max: 8.0, unit: ratio,
     description: "X scale multiplier."}
  - {name: scale-y, type: float, min: 0.1, max: 8.0, unit: ratio,
     description: "Y scale multiplier."}
  - {name: scale-z, type: float, min: 0.1, max: 8.0, unit: ratio,
     description: "Z scale multiplier."}
