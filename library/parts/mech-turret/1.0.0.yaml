name: mech-turret
family: mechanical
version: "1.0.0"
description: "Closed rigid turret with a yaw control."
surface:
  mode: sweep
  kind: rigid-part
  bones: ["@mount"]
  rigid_bone: "@mount"
  rings: 4
  segments: 8
  radius: {start: 0.2, end: 0.2}
  material: chitin
params:
  - {name: rings, type: int, min: 2, max: 12, unit: count,
     description: "Rings along the turret."}
  - {name: segments, type: int, min: 3, max: 16, unit: count,
     description: "Radial segments per ring."}
  - {name: scale-y, type: float, min: 0.1, max: 5.0, unit: ratio,
     description: "Y scale multiplier."}
controls:
  - {name: yaw, joint: "@mount", axis: [0, 1, 0], mode: rotation,
     range: {min: -180, max: 180}, default: 0, units: deg}
