name: vehicle-rotor
family: vehicle
version: "1.0.0"
description: "Closed rotor with an unbounded spin control and ambient rotation."
surface:
  mode: sweep
  kind: rigid-part
  bones: ["@mount"]
  rigid_bone: "@mount"
  rings: 3
  segments: 8
  radius: {start: 0.5, end: 0.5}
  modifiers:
    squash: [1.0, 0.08, 1.0]
  material: chitin
params:
  - {name: rings, type: int, min: 2, max: 12, unit: count,
     description: "Rings along the rotor."}
  - {name: segments, type: int, min: 3, max: 16, unit: count,
     description: "Radial segments per ring."}
  - {name: scale-x, type: float, min: 0.1, max: 5.0, unit: ratio,
     description: "X scale multiplier."}
  - {name: scale-z, type: float, min: 0.1, max: 5.0, unit: ratio,
     description: "Z scale multiplier."}
controls:
  - {name: spin, joint: "@mount", axis: [0, 1, 0], mode: rotation,
     unbounded: true, default: 0, units: deg}
auto:
  - {name: spin, kind: rotate, joint: "@mount", axis: [0, 1, 0], rate: 90, phase: 0}
