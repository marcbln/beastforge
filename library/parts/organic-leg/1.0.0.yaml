name: organic-leg
family: organic
version: "1.0.0"
description: "Closed tapered organic leg with hip and knee controls."
surface:
  mode: sweep
  kind: swept-solid
  bones: ["@upper", "@lower", "@foot"]
  rings: 10
  segments: 8
  radius: {start: 0.12, end: 0.05}
  blend: 0.25
  material: hide
params:
  - {name: radius-start, type: float, min: 0.02, max: 0.5, unit: m,
     description: "Radius at the root."}
  - {name: radius-end, type: float, min: 0.01, max: 0.5, unit: m,
     description: "Radius at the tip."}
  - {name: rings, type: int, min: 4, max: 32, unit: count,
     description: "Rings along the leg."}
  - {name: segments, type: int, min: 4, max: 24, unit: count,
     description: "Radial segments per ring."}
controls:
  - {name: swing, joint: "@upper", axis: [1, 0, 0], mode: rotation,
     range: {min: -35, max: 35}, default: 0, units: deg}
  - {name: lift, joint: "@lower", axis: [1, 0, 0], mode: rotation,
     range: {min: -60, max: 10}, default: 0, units: deg}
