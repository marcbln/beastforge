[project]
name = "beastforge"
dynamic = ["version"]
description = "Offline, deterministic CLI that generates animated, skinned 3D creatures from declarative YAML recipes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "beastforge maintainers" }]
keywords = ["procedural", "creatures", "gltf", "3d", "cli", "deterministic"]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12,<0.16",
    "rich>=13.7",
    "Pillow>=10.3",
    "texforge",
]

[project.scripts]
beastforge = "beastforge.cli.app:main"

[project.urls]
Homepage = "https://github.com/marc/beastforge"
Repository = "https://github.com/marc/beastforge"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.10",
    "jsonschema>=4.22",
    "trimesh>=4.0",
    "types-PyYAML",
]
viewer = [
    "playwright>=1.44",
]

[tool.uv.sources]
texforge = { path = "../texforge", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/beastforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/beastforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running determinism loops (SC-002)",
    "consumer: optional external-consumer checks",
    "viewer: opt-in browser smoke check (requires BEASTFORGE_VIEWER_SMOKE=1)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"src/beastforge/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
check_untyped_defs = true
warn_unused_ignores = true
mypy_path = "src"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
